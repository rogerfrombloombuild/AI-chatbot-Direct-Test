<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Direct Hotline</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101114;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #292a30;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    .message {
      padding: 13px 16px;
      margin: 12px 0;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #30323a;
      margin-left: auto;
    }

    .bot {
      background: #1c1e24;
      margin-right: auto;
    }

    form {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 850px;
      padding: 16px;
      margin: 0 auto;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #383a43;
      background: #1c1e24;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #eeeeee;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      color: #92949d;
      font-size: 12px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>The Direct Hotline</header>

  <main id="chat">
    <div class="message bot">Welcome to The Direct Hotline. What's on your mind?</div>
  </main>

  <div id="status">Ready</div>

  <form id="form">
    <input id="message" placeholder="Message The Direct Hotline..." autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    // Replace this with your Cloudflare Worker URL after creating it.
    const API_URL = "https://ai-chatbot-direct-test.roger-from-bloombuild.workers.dev/";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    const messages = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || send.disabled) return;

      if (API_URL.includes("PASTE_YOUR")) {
        status.textContent = "Set your Cloudflare Worker URL in the code first.";
        return;
      }

      addMessage(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";
      send.disabled = true;
      status.textContent = "Thinking...";

      try {
        const response = await fetch(API_URL + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "The server returned an error.");
        }

        const reply = data.reply || "I couldn't generate a response.";
        addMessage(reply, "bot");
        messages.push({ role: "assistant", content: reply });

        // Keep the conversation history from growing forever.
        if (messages.length > 20) messages.splice(0, 2);

        status.textContent = "Ready";
      } catch (error) {
        addMessage("Sorry, something went wrong. " + error.message, "bot");
        messages.pop();
        status.textContent = "Connection error";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
